publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_local_notifications: 22.3.0
  flutter_timezone: 5.1.0
  go_router: 18.0.0
  image_picker: 1.2.3
  intl: 0.20.3
  sqflite: 2.4.3
  supabase_flutter: 2.17.2
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
