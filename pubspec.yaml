name: caloris
description: Calorie, food, weight, schedule, and healthy habit tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_local_notifications: 22.3.0
  flutter_timezone: 5.1.0
  geolocator: 14.0.3
  go_router: 18.0.0
  image_picker: 1.2.3
  intl: 0.20.3
  pedometer: 4.2.0
  permission_handler: 12.0.3
  sqflite: 2.4.3
  supabase_flutter: 2.17.2
  timezone: 0.11.1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/caloris_logo.png
